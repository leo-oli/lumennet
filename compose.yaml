services:
  backend:
    build:
      context: ./backend
    container_name: lumennet-api
    restart: unless-stopped
    ports:
      - ${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8000}


  frontend:
    build:
      context: ./frontend
    container_name: lumennet-gui
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-7860}:${FRONTEND_PORT:-7860}
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-7860}
      - API_URL=http://backend:${BACKEND_PORT:-8000}/enhance
    depends_on:
      - backend
